name: Database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm --prefix supabase ci --ignore-scripts
      - run: npm --prefix supabase test
